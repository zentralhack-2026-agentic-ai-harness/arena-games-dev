[project]
name = "arena-games-dev"
version = "0.1.0"
description = "Development games for Zentral Hack 2026 (spec, simulator and baselines per game)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["arena"]

[project.optional-dependencies]
render = [
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
# Local checkout during development; switch to a git source once arena is published.
arena = { path = "../arena", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "RUF012", # Mutable default value for class attribute
]
