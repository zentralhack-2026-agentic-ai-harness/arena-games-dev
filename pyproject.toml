[project]
name = "arena-games-dev"
version = "0.1.0"
description = "Development games for Zentral Hack 2026 (spec, simulator and baselines per game)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["arena"]

[project.optional-dependencies]
render = [
    "matplotlib>=3.11.2",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.uv.sources]
# Tracks main; uv.lock pins the exact commit. `uv lock --upgrade-package arena` moves it.
arena = { git = "https://github.com/zentralhack-2026-agentic-ai-harness/arena", branch = "main" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100
# spec.md code blocks are hand-formatted for readers; keep `ruff format` away from them.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]
ignore = [
    "RUF012", # Mutable default value for class attribute
]
